<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Bangalore Treats</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #fcf8ee; color: #1a1a1a; font-family: 'Nunito', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
            background-image: radial-gradient(circle, rgba(235, 84, 124, 0.05) 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .login-box { background: #fff; padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(47, 29, 88, 0.1); width: 100%; max-width: 400px; text-align: center; border: 2px solid rgba(235, 84, 124, 0.1); }
        .login-box img { max-height: 70px; margin-bottom: 20px; }
        .login-box h2 { color: #2f1d58; font-size: 1.8rem; margin-bottom: 25px; font-weight: 900; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #666; font-weight: 700; font-size: 0.95rem; }
        .form-group input { width: 100%; padding: 15px; background: #fcf8ee; border: 2px solid #eaeaea; color: #1a1a1a; border-radius: 12px; box-sizing: border-box; font-family: 'Nunito', sans-serif; font-weight: 600;}
        .form-group input:focus { outline: none; border-color: #eb547c; background: #fff;}
        button { background: #eb547c; color: #fff; padding: 15px; width: 100%; border: none; border-radius: 30px; font-weight: 800; cursor: pointer; font-size: 1.1rem; transition: transform 0.2s; box-shadow: 0 5px 15px rgba(235, 84, 124, 0.3);}
        button:hover { transform: translateY(-3px); }
        .flash { color: #e74c3c; margin-bottom: 15px; font-weight: 700; background: #fdedec; padding: 10px; border-radius: 10px;}
    </style>
</head>
<body>
    <div class="login-box">
        <img src="{{ url_for('static', filename='requirements/images/logo.jpeg') }}" alt="Bangalore Treats">
        <h2>Secure Dashboard</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="flash"><i class="fa-solid fa-triangle-exclamation"></i> {{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group"><label>Admin Username</label><input type="text" name="username" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
            <button type="submit">Unlock Dashboard <i class="fa-solid fa-key" style="margin-left:5px;"></i></button>
        </form>
    </div>
</body>
</html>
